name: Android (APK y AAB)

# Se ejecuta al subir una etiqueta vX.Y.Z o a mano (Actions > Android > Run workflow).
#  - Con los 4 secretos de firma: genera APK y AAB de release firmados.
#  - Sin ellos: genera un APK de depuración y lo avisa en el log.
# Etiqueta: adjunta los binarios a la Release de GitHub. A mano: los sube como artefacto.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo para crear la Release al subir una etiqueta
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Comprobar que la etiqueta coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con package.json (v${VERSION})"; exit 1
          fi

      - name: Comprobar que no hay claves versionadas
        run: |
          if git ls-files | grep -Ei '\.(keystore|jks|p12)$|keystore\.properties'; then
            echo "::error::Hay una clave o un keystore.properties versionado. Elimínalo del repositorio y trata la clave como comprometida."; exit 1
          fi

      - name: Instalar dependencias y pruebas
        run: |
          npm ci
          npm test

      - name: Sincronizar la web con Android
        run: npm run android:sync

      - name: Preparar la firma (si hay secretos)
        id: firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_KEYPASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "firmado=true" >> "$GITHUB_OUTPUT"
            echo "Hay secretos de firma: se generarán APK y AAB de release firmados."
          else
            echo "firmado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Se genera un APK de DEPURACIÓN, no apto para Play Store."
          fi

      - name: Compilar release firmado (APK y AAB)
        if: steps.firma.outputs.firmado == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          npm run android:release -- --console=plain

      - name: Compilar APK de depuración
        if: steps.firma.outputs.firmado != 'true'
        run: |
          chmod +x android/gradlew
          npm run android:debug -- --console=plain

      - name: Reunir los binarios
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          SHA7="${GITHUB_SHA::7}"
          mkdir -p salida
          if [ "${{ steps.firma.outputs.firmado }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "salida/crono-regatas-${VERSION}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "salida/crono-regatas-${VERSION}.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "salida/crono-regatas-${VERSION}-debug-${SHA7}.apk"
          fi
          ls -l salida
          # Nada de claves en lo que se publica
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Subir los binarios como artefacto (ejecución manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: crono-regatas-android
          path: salida/*
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar los binarios a la Release (etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: salida/*
