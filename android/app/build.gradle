apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Versión: la única fuente es "version" de package.json (X.Y.Z).
//   versionName = X.Y.Z   ·   versionCode = X*10000 + Y*100 + Z   (1.1.0 -> 10100)
def pkg = new JsonSlurper().parse(rootProject.file('../package.json'))
def (vMajor, vMinor, vPatch) = pkg.version.tokenize('.').collect { it as int }

// Firma de release. SOLO se lee de variables de entorno (ANDROID_KEYSTORE_PATH,
// ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) o de
// android/keystore.properties (ignorado por Git; ver docs/ANDROID.md).
// Si falta alguna, el release sale SIN firmar. Nunca escribas claves en este archivo.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) { keystoreFile.withInputStream { keystoreProps.load(it) } }
def firma = [
    storeFile    : System.getenv('ANDROID_KEYSTORE_PATH')     ?: keystoreProps['storeFile'],
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProps['storePassword'],
    keyAlias     : System.getenv('ANDROID_KEY_ALIAS')         ?: keystoreProps['keyAlias'],
    keyPassword  : System.getenv('ANDROID_KEY_PASSWORD')      ?: keystoreProps['keyPassword'],
]
def hasSigning = firma.values().every { it }

android {
    namespace = "es.regatas.cronometraje"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "es.regatas.cronometraje"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(firma.storeFile)
                storePassword firma.storePassword
                keyAlias firma.keyAlias
                keyPassword firma.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasSigning) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
