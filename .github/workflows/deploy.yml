name: Publicar en GitHub Pages

# Cada push a main publica la app. El workflow sella además la versión
# del service worker con el hash del commit, de modo que cada despliegue
# invalida la caché anterior sin tener que acordarse de subirla a mano.

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancela el que esté en curso: cancelar a
# medias puede dejar publicada una versión incompleta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar el sitio
        run: |
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          cp icons/*.png _site/icons/

      - name: Sellar la versión del service worker
        run: |
          BUILD_ID="${GITHUB_SHA::7}"
          sed -i "s/^const CACHE_VERSION = .*/const CACHE_VERSION = '$BUILD_ID';/" _site/sw.js
          echo "Versión de caché: $BUILD_ID"
          grep -n "^const CACHE_VERSION" _site/sw.js

      - name: Comprobar que no falta nada
        run: |
          set -e
          for f in index.html manifest.webmanifest sw.js \
                   icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png \
                   icons/apple-touch-icon.png icons/favicon-32.png; do
            if [ ! -s "_site/$f" ]; then echo "::error::Falta o está vacío: $f"; exit 1; fi
          done
          echo "Todos los archivos presentes."

      - name: Validar el JavaScript y el manifest
        run: |
          set -e
          node --check _site/sw.js
          # Extrae el <script> de index.html y comprueba que compila,
          # para no publicar una app rota por un error de sintaxis.
          python3 - <<'PY'
          import re, pathlib, subprocess, sys, json
          html = pathlib.Path('_site/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              sys.exit('::error::No se encontró ningún <script> en index.html')
          pathlib.Path('/tmp/app.js').write_text(scripts[-1], encoding='utf-8')
          r = subprocess.run(['node', '--check', '/tmp/app.js'], capture_output=True, text=True)
          if r.returncode:
              sys.exit('::error::Error de sintaxis en index.html\n' + r.stderr)
          m = json.loads(pathlib.Path('_site/manifest.webmanifest').read_text(encoding='utf-8'))
          for k in ('name', 'start_url', 'scope', 'display', 'icons'):
              if k not in m:
                  sys.exit(f'::error::Al manifest le falta "{k}"')
          print('JavaScript y manifest correctos.')
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
